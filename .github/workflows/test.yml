name: Alıştırma kontrolü

on:
  push:
  workflow_dispatch:

jobs:
  haftalari-bul:
    # Hocanın reposunda çalışmasın; yalnızca öğrenci fork'larında çalışsın.
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    outputs:
      haftalar: ${{ steps.bul.outputs.haftalar }}
    steps:
      - uses: actions/checkout@v4
      - id: bul
        run: echo "haftalar=$(ls -d hafta*/ | tr -d / | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  kontrol:
    needs: haftalari-bul
    name: ${{ matrix.hafta }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # bir hafta kırmızıysa diğerleri yine çalışsın
      matrix:
        hafta: ${{ fromJson(needs.haftalari-bul.outputs.haftalar) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pytest kur
        run: pip install pytest

      - name: Haftanın ek paketlerini kur
        working-directory: ${{ matrix.hafta }}
        run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Python testleri
        working-directory: ${{ matrix.hafta }}
        run: python -m pytest -v
